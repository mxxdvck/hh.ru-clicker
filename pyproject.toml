[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [".venv", "data", "backups"]

[tool.ruff.lint]
# Start with correctness rules. Style can be tightened without blocking the
# existing upstream codebase on thousands of cosmetic findings.
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
